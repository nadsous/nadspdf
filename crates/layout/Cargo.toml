[package]
name = "pdfcraft-layout"
description = "NadsPDF Mise en page: page layout (frames, threaded text, styles) on DesignCraft's engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
designcraft-engine = { path = "../../vendor/designcraft/crates/engine" }
designcraft-pdf = { path = "../../vendor/designcraft/crates/pdf" }
designcraft-render = { path = "../../vendor/designcraft/crates/render" }
designcraft-format = { path = "../../vendor/designcraft/crates/format" }
designcraft-fonts = { path = "../../vendor/designcraft/crates/fonts" }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Reads a saved page layout's meta.json (already in the tree through the layout engine).
zip = { version = "3", default-features = false, features = ["deflate"] }
